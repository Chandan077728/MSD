<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Career Prediction Result</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-image: url('/static/images/background.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      backdrop-filter: blur(4px);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
    }

    .result-card {
      background-color: rgba(255, 255, 255, 0.95);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      max-width: 600px;
      width: 100%;
    }

    h2 {
      text-align: center;
      color: #343a40;
      margin-bottom: 25px;
    }

    .result-text {
      font-size: 20px;
      font-weight: 500;
      color: #007bff;
      text-align: center;
      margin-top: 20px;
    }

    .btn-home {
      margin-top: 30px;
      background-color: #007bff;
      color: #fff;
      font-weight: bold;
      border-radius: 10px;
      width: 100%;
    }

    .btn-home:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <div class="result-card">
    <h2>Career Prediction Result</h2>

    <!-- Replace this with your dynamic result content -->
    <p class="result-text">
      Your ideal career path is: <strong>{{ prediction }}</strong>
    </p>

    {% if confidence %}
      <p class="text-center text-muted mt-3">
        Confidence: <strong>{{ confidence }}%</strong>
      </p>
    {% endif %}

    {% if suggestions %}
      <div class="mt-4">
        <h5>Recommendations:</h5>
        <ul class="list-group list-group-flush">
          {% for suggestion in suggestions %}
            <li class="list-group-item">{{ suggestion }}</li>
          {% endfor %}
        </ul>
      </div>
    {% endif %}

    <a href="/" class="btn btn-home mt-4">Back to Form</a>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
