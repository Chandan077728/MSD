<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Career Prediction Form</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-image: url('/statsic/images/background.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      backdrop-filter: blur(4px);
      min-height: 100vh;
      padding-top: 50px;
    }

    .form-container {
      background-color: rgba(255, 255, 255, 0.95);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }

    h2 {
      text-align: center;
      margin-bottom: 30px;
      color: #343a40;
    }

    .btn-custom {
      background-color: #007bff;
      color: #fff;
      border-radius: 10px;
      font-weight: 600;
    }

    .btn-custom:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="form-container mx-auto col-lg-8">
      <h2>Career Prediction Form</h2>
      <form action="/predict" method="POST" class="row g-3">
        <div class="col-md-6">
          <label for="programming" class="form-label">Programming</label>
          <input type="number" step="any" class="form-control" name="programming" required>
        </div>
        <div class="col-md-6">
          <label for="maths" class="form-label">Maths</label>
          <input type="number" step="any" class="form-control" name="maths" required>
        </div>
        <div class="col-md-6">
          <label for="communication" class="form-label">Communication</label>
          <input type="number" step="any" class="form-control" name="communication" required>
        </div>
        <div class="col-md-6">
          <label for="logic" class="form-label">Logic</label>
          <input type="number" step="any" class="form-control" name="logic" required>
        </div>
        <div class="col-md-6">
          <label for="self_learning" class="form-label">Self Learning</label>
          <input type="number" step="any" class="form-control" name="self_learning" required>
        </div>
        <div class="col-md-6">
          <label for="projects_completed" class="form-label">Projects Completed</label>
          <input type="number" step="any" class="form-control" name="projects_completed" required>
        </div>
        <div class="col-md-6">
          <label for="years_experience" class="form-label">Years Experience</label>
          <input type="number" step="any" class="form-control" name="years_experience" required>
        </div>
        <div class="col-md-6">
          <label for="internships" class="form-label">Internships</label>
          <input type="number" step="any" class="form-control" name="internships" required>
        </div>
        <div class="col-12">
          <label for="gpa" class="form-label">GPA</label>
          <input type="number" step="any" class="form-control" name="gpa" required>
        </div>
        <div class="col-12 mt-4">
          <button type="submit" class="btn btn-custom w-100">Predict Career</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Bootstrap JS (Optional for interactive components) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
